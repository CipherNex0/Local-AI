<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zora AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at 20% 20%,#1e3a8a,#020617 70%);
  height:100vh;display:flex;justify-content:center;align-items:center;color:#e5e7eb
}
#chat{
  width:92%;max-width:900px;height:88vh;
  background:rgba(2,6,23,.75);backdrop-filter:blur(25px);
  border-radius:22px;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid rgba(59,130,246,.25);box-shadow:0 0 60px rgba(59,130,246,.25)
}
.header{
  padding:18px 22px;font-size:20px;font-weight:600;letter-spacing:.8px;
  background:linear-gradient(90deg,#2563eb,#60a5fa);
  display:flex;justify-content:space-between;align-items:center
}
.status{font-size:12px;opacity:.8}
#messages{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column}
.msg{max-width:72%;padding:14px 18px;margin:8px 0;border-radius:18px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.user{align-self:flex-end;background:linear-gradient(135deg,#2563eb,#1e40af)}
.ai{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.typing{opacity:.6;font-style:italic}
.input-area{display:flex;gap:10px;padding:14px;background:rgba(2,6,23,.9)}
#input{flex:1;padding:14px;border-radius:14px;border:none;outline:none;background:rgba(255,255,255,.07);color:white}
#input:focus{background:rgba(255,255,255,.12)}
button{padding:14px 20px;border:none;border-radius:14px;cursor:pointer;font-weight:500;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white}
button:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(59,130,246,.5)}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:#2563eb;border-radius:10px}
</style>
</head>
<body>
<div id="chat">
  <div class="header">
    <div>💎 Zora AI</div>
    <div class="status" id="status">Ready</div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input id="input" placeholder="Message Zora... (Press Enter)" />
    <button onclick="send()">Send</button>
  </div>
</div>
<script>
const messages=document.getElementById('messages');
const input=document.getElementById('input');
const statusText=document.getElementById('status');

input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send();}});

function addMessage(text,cls){
  const div=document.createElement('div');
  div.className='msg '+cls;
  div.textContent=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
  return div;
}

async function send(){
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  addMessage(text,'user');

  statusText.textContent='Thinking...';
  const typing=addMessage('Zora is typing...','ai typing');

  try{
    const res=await fetch('http://localhost:8000/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text})
    });
    const data=await res.json();
    typing.remove();
    addMessage(data.reply,'ai');
    statusText.textContent='Ready';
  }catch(e){
    typing.remove();
    addMessage('Connection error — backend not reachable.','ai');
    statusText.textContent='Offline';
  }
}
</script>
</body>
</html>
